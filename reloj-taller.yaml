esphome:
  name: reloj-taller
  friendly_name: reloj_taller

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "3+wUR84zPWedjLPW8HlNnSF+Z7lC9u/2L2nFG1uCHZk="

ota:
  - platform: esphome
    password: "d9c0766fdfb0f7775231f43f221cc028"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Reloj-Taller Fallback Hotspot"
    password: "fjHBxQ1ay2XW"

captive_portal:
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO15

sensor:
  - platform: homeassistant
    id: red
    entity_id: sensor.sb5_0_1av_41_936_metering_power_absorbed
    internal: true
    
  - platform: homeassistant
    id: solar
    entity_id: sensor.generacion_solar_unknown
    internal: true
    
  - platform: homeassistant
    id: excedentes
    entity_id: sensor.sb5_0_1av_41_936_metering_power_supplied
    internal: true

display:
  - platform: max7219digit
    cs_pin: GPIO13
    num_chips: 4
    lambda: |-
      it.strftime(0, 0, id(digit_font), "%H:%M", id(hass_time).now());
#      it.line(0, 7, 31, 7);
#      it.printf(0, 0, id(digit_font), "%.2f W", id(red));

font:
  - file: "pixelmix.ttf"
    id: digit_font
    size: 8

time:
  - platform: homeassistant
    id: hass_time