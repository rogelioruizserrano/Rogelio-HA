substitutions:
  name: "m5stackdial"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

esphome:
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: smarthomeyourself.m5_dial
    version: "1.2"
  platformio_options:
    lib_deps:
      - Wire
      - EEPROM
      - ArduinoJson
      - m5stack/M5Unified@0.2.14
      - m5stack/M5Dial@1.0.3
      # OJO: quitamos aquí "m5stack/M5GFX@0.2.20" a propósito.
      # Esa versión exacta ya no se puede descargar del registro de
      # PlatformIO ("UnknownPackageError: Could not find the package
      # with 'm5stack/M5GFX @ 0.2.20'"), y como viene fijada así dentro
      # de shys-m5-dial.yaml, usar `packages:` para importarlo la vuelve
      # a meter sin que podamos quitarla (las listas de un package se
      # concatenan, nunca se sobrescriben). M5Unified ya pide M5GFX
      # como dependencia (>=0.2.20), así que PlatformIO instalará solo
      # la versión más reciente compatible (ahora mismo la 0.2.28) sin
      # que la pidamos explícitamente.

# Traemos solo el componente en sí (el código C++), no el yaml completo
# del proyecto, para no arrastrar ese lib_deps roto.
external_components:
  - source:
      type: git
      url: https://github.com/SmartHome-yourself/m5-dial-for-esphome/
      ref: main
    components: [shys_m5_dial]

# Toolchain clásico de PlatformIO: evita que ESPHome intente convertir
# M5Unified/M5Dial/M5GFX en componentes de ESP-IDF (donde chocaba con
# "No version of m5stack/M5GFX satisfies...").
esp32:
  board: esp32-s3-devkitc-1
  toolchain: platformio
  framework:
    type: arduino
    advanced:
      include_builtin_idf_components:
        - esp_lcd
  flash_size: 8MB

logger:
  level: INFO
  logs:
    api: WARN
    esp32.preferences: WARN
    LOOP: WARN
    DISPLAY: WARN
    TOUCH: WARN
    HA_API: WARN
    DEVICE: WARN
    MEDIAPLAYER: WARN

ota:
  platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    password: "12345678"

captive_portal:

api:
  homeassistant_states: true
  homeassistant_services: true
  custom_services: true
  encryption:
    key: "LYOyak5NwU4Bvn/CgYd2zYqjmpGUhppS3BgmIDmyr30="

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Madrid

shys_m5_dial:
  name: Dial
  time_component: homeassistant_time
  screen_off_time: 45000
  screensaver: clock
  rotary_step_width: 1
  long_press_duration: 1200
  font: default
  font_factor: 1
  display_rotate: 1

  devices:
    lights:
      - entity: light.ventilador_salita
        name: Lampara de la salita
        modes:
          dimm_mode:
            enable: true
            rotary_step_width: 10
          rgb_mode:
            enable: true
            rotary_step_width: 30
          white_mode:
            enable: true
            rotary_step_width: 100
            min_kelvin: 2500
            max_kelvin: 7000

      - entity: light.yeelight_lamparita_salita
        name: Lamparita
        modes:
          dimm_mode:
            enable: true
            rotary_step_width: 10
          rgb_mode:
            enable: true
            rotary_step_width: 30
          white_mode:
            enable: true
            rotary_step_width: 100
            min_kelvin: 2500
            max_kelvin: 7000

    switches:

    climates:
      - entity: climate.casa
        name: Aire Acondicionado
        modes:
          temp_mode:
            rotary_step_width: 1
            min_temperature: 16
            max_temperature: 30
          fan_mode:
            rotary_step_width: 1
            modes:
              - auto
              - low
              - high

    covers:

    fans:
      - entity: fan.ventilador_salita
        name: Ventilador de la salita
        modes:
          speed_mode:
            changeable_direction: true
            rotary_step_width: 10

    media_player:
      - entity: media_player.tv_salita_lg
        name: TV LG Salita
        modes:
          play_mode:
            rotary_step_width: 1
          source_mode:
            rotary_step_width: 1
            sources:
              - name: Live TV
                content_id: LiveTV
                content_type: LiveTV
              - name: Netflix
                content_id: Netflix
                content_type: Netflix
              - name: Prime Video
                content_id: Prime Video
                content_type: Prime Video
              - name: Plex
                content_id: Plex
                content_type: Plex
              - name: YouTube
                content_id: YouTube
                content_type: YouTube
              - name: Jellyfin
                content_id: Jellyfin
                content_type: Jellyfin

    lock:


    number:


    timer:
      - entity: timer.my_timer
        name: Timer 1