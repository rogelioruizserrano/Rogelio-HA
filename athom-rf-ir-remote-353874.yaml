  room: casa

packages:
  athom.rf-ir-remote: github://athom-tech/esp32-configs/athom-rf-ir-remote.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: 9mZ+nGZsShQHO9M/Z/yqJsilFmDGBN4gWO20Uf65Cfk=
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret athom_rf_ir_remote_353874__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ── Añadidos propios ─────────────────────────────

# Proxy BLE advertising para ha-ble-adv (ventilador Mantra)
external_components:
  - source: github://NicoIIT/esphome-ble_adv_proxy

ble_adv_proxy:
  use_max_tx_power: true   # quítalo si diera problemas de compilación

# Añadir dump raw al receptor RF del paquete (merge por id con !extend)
remote_receiver:
  - id: !extend rf_receiver
    dump:
      - rc_switch
      - raw
    filter: 200us
    idle: 8ms

