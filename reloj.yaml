# Board: Waveshare ESP32-C3-Zero (Waveshare)
# Definition: definitions/boards/waveshare_esp32_c3_zero/manifest.yaml

esphome:
  name: reloj
  friendly_name: reloj

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "bayCj/aX7SI9+61B356OBfdl2/wW8J+Fh9R/uA05Wn4="
  actions:
    - action: mostrar_mensaje
      variables:
        texto: string
        segundos: int
      then:
        - lambda: |-
            id(msg_text) = texto;
            id(msg_until) = texto.empty() ? 0 : (millis() + segundos * 1000);

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: reloj Fallback Hotspot
    password: "8UMo7PERcBaN"

captive_portal:

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

time:
  - platform: homeassistant
    id: hass_time

globals:
  - id: msg_text
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: msg_until
    type: uint32_t
    restore_value: false
    initial_value: '0'

font:
  - file: "pixelmix.ttf"
    id: big_font
    size: 8

  - file:
      url: "https://raw.githubusercontent.com/hzeller/rpi-rgb-led-matrix/master/fonts/tom-thumb.bdf"
      type: web
    id: small_font

display:
  - platform: max7219digit
    cs_pin: GPIO3
    num_chips: 4
    update_interval: 500ms
    lambda: |-
      // ¿Hay un mensaje vigente? (resta con signo: inmune al desbordamiento de millis)
      if (!id(msg_text).empty() && (int32_t)(id(msg_until) - millis()) > 0) {
        it.print(16, 1, id(small_font), TextAlign::TOP_CENTER, id(msg_text).c_str());
        return;
      }

      auto t = id(hass_time).now();
      if (!t.is_valid()) {
        it.print(4, 0, id(big_font), "--:--");
        return;
      }

      int hh = t.hour;
      int mm = t.minute;

      it.printf( 4, 0, id(big_font), "%d", hh / 10);
      it.printf( 9, 0, id(big_font), "%d", hh % 10);
      it.printf(18, 0, id(big_font), "%d", mm / 10);
      it.printf(23, 0, id(big_font), "%d", mm % 10);

      // Dos puntos parpadeando cada segundo
      if (t.second % 2 == 0) {
        it.draw_pixel_at(15, 2, COLOR_ON);
        it.draw_pixel_at(15, 5, COLOR_ON);
      }