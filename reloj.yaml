# Board: Waveshare ESP32-C3-Zero (Waveshare)
# Definition: definitions/boards/waveshare_esp32_c3_zero/manifest.yaml

esphome:
  name: reloj
  friendly_name: reloj

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "bayCj/aX7SI9+61B356OBfdl2/wW8J+Fh9R/uA05Wn4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: reloj Fallback Hotspot
    password: "8UMo7PERcBaN"

captive_portal:

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

time:
  - platform: homeassistant
    id: hass_time

font:
  - file:
      url: "https://raw.githubusercontent.com/hzeller/rpi-rgb-led-matrix/master/fonts/tom-thumb.bdf"
      type: web
    id: digit_font

sensor:
  - platform: homeassistant
    id: red
    entity_id: sensor.gx_device_grid_power_l1
    internal: true

  - platform: homeassistant
    id: solar
    entity_id: sensor.generacion_solar_suma
    internal: true

  - platform: homeassistant
    id: SOC
    entity_id: sensor.gx_device_dc_battery_charge
    internal: true

display:
  - platform: max7219digit
    cs_pin: GPIO3
    num_chips: 4
    update_interval: 500ms
    lambda: |-
      // Hasta que HA no sincroniza la hora, now() no es válido
      auto t = id(hass_time).now();
      if (!t.is_valid()) {
        it.print(2, 2, id(digit_font), "--:--");
        return;
      }

      // Página 0, 1 o 2, cambiando cada 5 segundos
      int page = (t.second / 5) % 3;

      if (page == 0) {
        int hh = t.hour;
        int mm = t.minute;
        int ss = t.second;

        const int P = 4;   // paso entre los dos dígitos de un mismo grupo
        const int G = 6;   // paso entre grupos
        const int S = 0;   // desplazamiento del separador

        int x = 2;         // margen izquierdo

        it.printf(x, 2, id(digit_font), "%d", hh / 10);  x += P;
        it.printf(x, 2, id(digit_font), "%d", hh % 10);
        it.draw_pixel_at(x + P + S, 3, COLOR_ON);
        it.draw_pixel_at(x + P + S, 5, COLOR_ON);
        x += G;

        it.printf(x, 2, id(digit_font), "%d", mm / 10);  x += P;
        it.printf(x, 2, id(digit_font), "%d", mm % 10);
        it.draw_pixel_at(x + P + S, 3, COLOR_ON);
        it.draw_pixel_at(x + P + S, 5, COLOR_ON);
        x += G;

        it.printf(x, 2, id(digit_font), "%d", ss / 10);  x += P;
        it.printf(x, 2, id(digit_font), "%d", ss % 10);

      } else if (page == 1) {
        if (isnan(id(red).state))
          it.print(16, 2, id(digit_font), TextAlign::TOP_CENTER, "---");
        else
          it.printf(16, 2, id(digit_font), TextAlign::TOP_CENTER, "%.0fW", id(red).state);

      } else {
        if (isnan(id(SOC).state))
          it.print(16, 2, id(digit_font), TextAlign::TOP_CENTER, "---");
        else
          it.printf(16, 2, id(digit_font), TextAlign::TOP_CENTER, "%.0f%%", id(SOC).state);
      }