# Board: Waveshare ESP32-C3-Zero (Waveshare)
# Definition: definitions/boards/waveshare_esp32_c3_zero/manifest.yaml

esphome:
  name: reloj
  friendly_name: reloj

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "bayCj/aX7SI9+61B356OBfdl2/wW8J+Fh9R/uA05Wn4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: reloj Fallback Hotspot
    password: "8UMo7PERcBaN"

captive_portal:

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

time:
  - platform: homeassistant
    id: hass_time

font:
  - file: "pixelmix.ttf"
    id: big_font
    size: 8

  - file:
      url: "https://raw.githubusercontent.com/hzeller/rpi-rgb-led-matrix/master/fonts/tom-thumb.bdf"
      type: web
    id: small_font

sensor:
  - platform: homeassistant
    id: red
    entity_id: sensor.gx_device_grid_power_l1
    internal: true

  - platform: homeassistant
    id: solar
    entity_id: sensor.generacion_solar_suma
    internal: true

  - platform: homeassistant
    id: SOC
    entity_id: sensor.gx_device_dc_battery_charge
    internal: true

display:
  - platform: max7219digit
    cs_pin: GPIO3
    num_chips: 4
    update_interval: 500ms
    lambda: |-
      auto t = id(hass_time).now();
      if (!t.is_valid()) {
        it.print(4, 0, id(big_font), "--:--");
        return;
      }

      // Página 0, 1 o 2, cambiando cada 5 segundos
      int page = (t.second / 5) % 3;

      if (page == 0) {
        // --- HORA: HH:MM en fuente grande, centrada ---
        int hh = t.hour;
        int mm = t.minute;

        it.printf( 4, 0, id(big_font), "%d", hh / 10);
        it.printf( 9, 0, id(big_font), "%d", hh % 10);
        it.printf(18, 0, id(big_font), "%d", mm / 10);
        it.printf(23, 0, id(big_font), "%d", mm % 10);

        // Dos puntos parpadeando cada segundo
        if (t.second % 2 == 0) {
          it.draw_pixel_at(15, 2, COLOR_ON);
          it.draw_pixel_at(15, 5, COLOR_ON);
        }

      } else if (page == 1) {
        // --- POTENCIA DE RED ---
        it.print(0, 1, id(small_font), "Red");
        if (isnan(id(red).state))
          it.print(31, 0, id(big_font), TextAlign::TOP_RIGHT, "---");
        else
          it.printf(31, 0, id(big_font), TextAlign::TOP_RIGHT, "%.0f", id(red).state);

      } else {
        // --- ESTADO DE BATERÍA ---
        it.print(0, 1, id(small_font), "SOC");
        if (isnan(id(SOC).state))
          it.print(31, 0, id(big_font), TextAlign::TOP_RIGHT, "---");
        else
          it.printf(31, 0, id(big_font), TextAlign::TOP_RIGHT, "%.0f%%", id(SOC).state);
      }