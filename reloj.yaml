# Definition: definitions/boards/waveshare_esp32_c3_zero/manifest.yaml

esphome:
  name: reloj
  friendly_name: reloj

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "bayCj/aX7SI9+61B356OBfdl2/wW8J+Fh9R/uA05Wn4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: reloj Fallback Hotspot
    password: "8UMo7PERcBaN"

captive_portal:

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

time:
  - platform: homeassistant
    id: hass_time

font:
  - file: "pixelmix.ttf"
    id: digit_font
    size: 8

sensor:
  - platform: homeassistant
    id: red
    entity_id: sensor.gx_device_grid_power_l1
    internal: true

  - platform: homeassistant
    id: solar
    entity_id: sensor.generacion_solar_suma
    internal: true

  - platform: homeassistant
    id: SOC
    entity_id: sensor.gx_device_dc_battery_charge
    internal: true

display:
  - platform: max7219digit
    cs_pin: GPIO2
    num_chips: 4
    update_interval: 500ms
    lambda: |-
      // Hasta que HA no sincroniza la hora, now() no es válido
      auto t = id(hass_time).now();
      if (!t.is_valid()) {
        it.print(0, 0, id(digit_font), "--:--");
        return;
      }

      int hh = t.hour;
      int mm = t.minute;
      int ss = t.second;

      // --- Ajustes de reparto horizontal ---
      const int P = 3;   // paso entre los dos dígitos de un mismo grupo
      const int G = 6;   // paso del último dígito de un grupo al primero del siguiente
      const int S = 1;   // desplazamiento del separador dentro de ese hueco

      int x = 0;

      // Horas
      it.printf(x, 0, id(digit_font), "%d", hh / 10);  x += P;
      it.printf(x, 0, id(digit_font), "%d", hh % 10);
      it.draw_pixel_at(x + P + S, 2, COLOR_ON);
      it.draw_pixel_at(x + P + S, 5, COLOR_ON);
      x += G;

      // Minutos
      it.printf(x, 0, id(digit_font), "%d", mm / 10);  x += P;
      it.printf(x, 0, id(digit_font), "%d", mm % 10);
      it.draw_pixel_at(x + P + S, 2, COLOR_ON);
      it.draw_pixel_at(x + P + S, 5, COLOR_ON);
      x += G;

      // Segundos
      it.printf(x, 0, id(digit_font), "%d", ss / 10);  x += P;
      it.printf(x, 0, id(digit_font), "%d", ss % 10);
      it.draw_pixel_at(x + P + S, 2, COLOR_ON);
      it.draw_pixel_at(x + P + S, 5, COLOR_ON);
      x += G;
      
      // --- Ejemplos de uso de los sensores (descomentar si se quieren) ---
      // if (!isnan(id(red).state))
      //   it.printf(0, 0, id(digit_font), "%.0fW", id(red).state);
      //
      // if (!isnan(id(SOC).state))
      //   it.printf(0, 0, id(digit_font), "%.0f%%", id(SOC).state);