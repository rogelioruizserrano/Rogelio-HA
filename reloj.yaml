# Board: Waveshare ESP32-C3-Zero (Waveshare)
# Definition: definitions/boards/waveshare_esp32_c3_zero/manifest.yaml

esphome:
  name: reloj
  friendly_name: reloj

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "bayCj/aX7SI9+61B356OBfdl2/wW8J+Fh9R/uA05Wn4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: reloj Fallback Hotspot
    password: "8UMo7PERcBaN"

captive_portal:
spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

sensor:
  - platform: homeassistant
    id: red
    entity_id: sensor.gx_device_grid_power_l1
    internal: true
    
  - platform: homeassistant
    id: solar
    entity_id: sensor.generacion_solar_suma
    internal: true
    
  - platform: homeassistant
    id: SOC
    entity_id: sensor.gx_device_dc_battery_charge
    internal: true

display:
  - platform: max7219digit
    cs_pin: GPIO2
    num_chips: 4
    lambda: |-
      it.strftime(0, 0, id(digit_font), "%H:%M:%S", id(hass_time).now());
      it.line(0, 7, 31, 7);
      it.printf(0, 0, id(digit_font), "%.2f W", id(red));

font:
  - file: "pixelmix.ttf"
    id: digit_font
    size: 8

time:
  - platform: homeassistant
    id: hass_time
