esphome:
  name: consumo-taller
  friendly_name: consumo taller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  baud_rate: 0 

# Enable Home Assistant API
api:
  encryption:
    key: "5a7ylqqQWd+4bjubjjdxh/J1QqdqpHFmu+KHfVmxxjw="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Consumo-Taller Fallback Hotspot"
    password: "YF7m6DCUiFrW"

captive_portal:
    
uart:
  id: uart_pzem
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1
  
modbus:
  id: modbus_pzem
  uart_id: uart_pzem

sensor:
  - platform: pzemac
    id: pzem
    modbus_id: modbus_pzem
    update_interval: 2s
    current:
      name: "Corriente"
      filters:
        - throttle_average: 10s
    voltage:
      name: "Tensión"
      filters:
        - throttle_average: 10s
    power:
      name: "Potencia"
      filters:
        - throttle_average: 10s
    energy:
      name: "Energía"
      filters:
        - multiply: 0.001
        - throttle: 60s
      unit_of_measurement: kWh
      accuracy_decimals: 3
    frequency:
      name: "Frecuencia"
      filters:
        - throttle_average: 30s
    power_factor:
      name: "Factor de potencia"
      filters:
        - throttle_average: 10s

button:
  - platform: template
    name: "Reset energía PZEM"
    entity_category: config
    on_press:
      - pzemac.reset_energy: pzem

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms

bluetooth_proxy:
  active: true