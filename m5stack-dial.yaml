substitutions:
  timezone: Europe/Madrid

  api_encryption_key: !secret dial_api_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Opcionales: si los dejas tal cual (con estos valores de ejemplo),
  # esa página del menú queda automáticamente oculta.
  weather_entity: weather.pirateweather
  aqi_entity: sensor.tu_aqi
  climate_entity: climate.casa
  timer_entity: timer.your_timer

  # Reutilizamos tu TV como "Music" (play/pausa, volumen y metadatos;
  # no hay selector de fuentes/apps en este firmware).
  music_player_entity: media_player.tv_salita_lg

  screen_return_timeout: 30s
  screen_dim_timeout: 15s
  screen_off_timeout: 60s
  screen_dim_brightness: "20%"

# Deja la lista vacía (o coméntala) si todavía no quieres activar Lights.
dial_lights: []
  # - entity_id: light.mi_luz1
  #   name: Luz 1
  # - entity_id: light.mi_luz2
  #   name: Luz 2

packages:
  smart_home_button:
    url: https://github.com/hectorzin/m5stack-dial-home-assistant
    ref: main
    files:
      - dial.yaml
    refresh: 0s