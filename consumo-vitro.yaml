esphome:
  name: consumo-vitro

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    password: "1da1052a3a1b9a114094b474f81574d6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.53
    gateway: 192.168.2.1
    subnet: 255.255.255.0
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Consumo-Vitro Fallback Hotspot"
    password: "dQqoG3ilyHHg"

captive_portal:

uart:
  rx_pin: D1
  tx_pin: D2
  baud_rate: 9600
  stop_bits: 1
  
sensor:
  - platform: pzemac
    current:
      name: "consumo-vitro Current"
    voltage:
      name: "consumo-vitro Voltage"
    energy:
      name: "consumo-vitro Energy"
    power:
      name: "consumo-vitro Power"
    frequency:
      name: "consumo-vitro Frequency"
    power_factor:
      name: "consumo-vitro Power Factor"
    update_interval: 3s