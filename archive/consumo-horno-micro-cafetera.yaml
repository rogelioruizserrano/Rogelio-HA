esphome:
  name: consumo-horno-micro-cafetera
  friendly_name: consumo horno-micro-cafetera
  
esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "cfGRULpMSoxe+5KYOdY1xzGpVt52oHlaaZKeUnVc+mU="

ota:
  - platform: esphome
    password: "d0edd137a9051a16b69e02028dca6b24"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Consumo-Horno-Micro-Cafetera"
    password: "weqShrKB7TLB"

captive_portal:

uart:
  rx_pin: GPIO5
  tx_pin: GPIO4
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE

modbus:
  send_wait_time: 250ms

sensor:
  - platform: pzemac
    id: pzemac_1
    current:
      name: "PZEM-004T V3 Current"
      filters:
        multiply: 1.43
    voltage:
      name: "PZEM-004T V3 Voltage"
    energy:
      name: "PZEM-004T V3 Energy"
    power:
      name: "PZEM-004T V3 Power"
      filters:
        multiply: 1.43
    frequency:
      name: "PZEM-004T V3 Frequency"
    power_factor:
      name: "PZEM-004T V3 Power Factor"
    update_interval: 1s

button:
  - platform: template
    name: "kWh reset"
    on_press:
      - pzemac.reset_energy: pzemac_1


