esphome:
  name: tortuguera2

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "kG2sxkP7Ufs2XroKD2a7XHoVobY8XIkY+wuM0qyzKx8="

ota:
  - platform: esphome
    password: "22f39abc67ab8e8e563579bdd2513a89"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tortuguera2 Fallback Hotspot"
    password: "faiiTBczVxMG"

captive_portal:

web_server:
  port: 80

switch:
  - platform: gpio
    name: "calentador"
    pin: GPIO23
    id: celentador
  - platform: gpio
    name: "filtro"
    pin: GPIO22
    id: filtro
  
one_wire:
  - platform: gpio
    pin: GPIO21
    id: temperatura_agua

binary_sensor:
  - platform: homeassistant
    id: calentador_automatico
    entity_id: input_boolean.calentador_del_agua_de_la_tortuguera_automatico
    
sensor:
  - platform: dallas_temp
    address: 0x853c01b5565ec628
    name: "Temperatura del agua 2"
    one_wire_id: temperatura_agua
    on_value_range:
      - above: 25.0
        then:
          - if:
              condition:
                lambda: |-
                  return !id(calentador_automatico).has_state() || id(calentador_automatico).state;
              then:
                - switch.turn_off: celentador
      - below: 24.0
        then:
          - if:
              condition:
                lambda: |-
                  return !id(calentador_automatico).has_state() || id(calentador_automatico).state;
              then:
                - switch.turn_on: celentador
    id: temperatura_agua_tortuguera
