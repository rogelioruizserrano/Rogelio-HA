esphome:
  name: multisensor-salita
  friendly_name: multisensor salita

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    

logger:

api:
  encryption:
    key: "W4qRorEJSp0AycMK6e8MKM2ev4Ze2n7Lg3HMNpMS+cs="

ota:
  - platform: esphome
    password: "e88d3d96cf4b515387fe740d9c3ad1f5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.18
    gateway: 192.168.2.1
    subnet: 255.255.255.0
  ap:
    ssid: "Multisensor-Salita"
    password: "7AUAIYQ87dpa"

web_server:
  port: 80

captive_portal:

binary_sensor:
  - platform: status
    name: "Sensor Status"

uart:
  - rx_pin: GPIO16
    baud_rate: 9600
    id: uart_rx_1
  - rx_pin: GPIO1
    tx_pin: GPIO3
    baud_rate: 9600
    id: uart_2

sensor:
  - platform: pm1006
    pm_2_5:
      name: "Medidor de particulas 2.5µm concentracion"
    uart_id: uart_rx_1
    
  - platform: mhz19
    co2:
      name: "MH-Z19 CO2 medidor salita"
    temperature: 
      name: "MH-Z19 Temperatura medidor salita"
    update_interval: 60s
    automatic_baseline_calibration: true
    uart_id: uart_2
    id: medidor_co2

button:
  - platform: template
    name: "Calibrate Zero (20 minutes at 400ppm)"
    id: calibrate_zero
    entity_category: diagnostic
    on_press:
      - mhz19.calibrate_zero: medidor_co2

switch: 
  - platform: template
    name: "Automatic Baseline Calibration"
    entity_category: diagnostic
    optimistic: true
    on_turn_on:
      mhz19.abc_enable: medidor_co2
    on_turn_off:
      mhz19.abc_disable: medidor_co2

output:
  - platform: ledc
    pin: GPIO4
    frequency: 4882Hz
    id: pwm_output
  
fan:
  - platform: speed
    output: pwm_output
    name: "Ventilador medidor de particulas"
    id: fan_1

