esphome:
  name: luz-puerta-azotea

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  password: "692c603c33a646d511a96d49f0c38a99"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Luz-Puerta-Azotea"
    password: "U9Gt3uvuKznm"

captive_portal:

web_server:
  port: 80

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Luz puerta azotea Button"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Luz puerta azotea Relay"
    pin: GPIO12
    id: relay

status_led:
  pin:
    number: GPIO13
    inverted: yes