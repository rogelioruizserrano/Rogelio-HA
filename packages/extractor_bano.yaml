# ============================================================
# Extractor baño — package de Home Assistant
# Fichero: /config/packages/extractor_bano.yaml
#
# Requiere en configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Entidades externas (si tus IDs son otros, reemplázalos en
# este fichero con buscar/reemplazar):
#   fan.ventilacion_mecanica              Shelly 1 Mini Gen3 (192.168.2.92)
#   light.luz_bano                        Shelly de la luz (192.168.2.91)
#   sensor.temperatura_bano_humidity      BLU H&T
#   binary_sensor.puerta_del_bano_window  BLU Door/Window puerta  (on = abierta)
#   binary_sensor.ventana_bano_ventana    BLU Door/Window ventana (on = abierta)
#
# Script del Shelly: id 1 -> URL /script/1/ha (ajustar si es otro)
#
# Reparto del control:
#   - "HA al mando" = control activado + humedad y extractor
#     disponibles en HA. Mientras lo esté, HA envía un latido cada
#     minuto y el Shelly no toca el relé.
#   - Si HA cae, se reinicia o pierde los sensores, el Shelly pasa
#     a modo local en <= 3-4 min (o al instante con "liberar").
#   - Umbrales, purga y horario se configuran aquí; viajan al
#     Shelly en cada latido.
# ============================================================

# ------------------------------------------------------------
# AJUSTES (configurables desde la UI)
# ------------------------------------------------------------
input_boolean:
  extractor_bano_control_ha:
    name: "Extractor baño · control desde HA"
    icon: mdi:home-assistant

input_number:
  extractor_bano_humedad_alta:
    name: "Extractor baño · humedad alta"
    min: 40
    max: 95
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent-alert
  extractor_bano_humedad_baja:
    name: "Extractor baño · humedad baja"
    min: 35
    max: 90
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent
  extractor_bano_purga_min:
    name: "Extractor baño · duración purga"
    min: 1
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:fan-clock

input_datetime:
  extractor_bano_hora_inicio:
    name: "Extractor baño · hora inicio"
    has_date: false
    has_time: true
  extractor_bano_hora_fin:
    name: "Extractor baño · hora fin"
    has_date: false
    has_time: true

timer:
  extractor_bano_purga:
    name: "Extractor baño · purga"
    icon: mdi:fan
    restore: true

# ------------------------------------------------------------
# ESTADOS DERIVADOS (una sola definición, se usan en todo)
# ------------------------------------------------------------
template:
  - binary_sensor:
      # Puerta o ventana abierta. Desconocido = abierto (igual que el Shelly).
      - name: "Extractor baño ventilación posible"
        unique_id: extractor_bano_ventilacion_posible
        icon: mdi:door-open
        state: >
          {{ not (is_state('binary_sensor.puerta_del_bano_window', 'off')
                  and is_state('binary_sensor.ventana_bano_ventana', 'off')) }}

      - name: "Extractor baño en horario"
        unique_id: extractor_bano_en_horario
        icon: mdi:clock-outline
        state: >
          {% set ini = state_attr('input_datetime.extractor_bano_hora_inicio', 'timestamp') | int(0) %}
          {% set fin = state_attr('input_datetime.extractor_bano_hora_fin', 'timestamp') | int(0) %}
          {% set ahora = now().hour * 3600 + now().minute * 60 %}
          {{ ini <= ahora < fin }}

      # HA solo manda si tiene lo necesario para decidir y actuar.
      - name: "Extractor baño HA al mando"
        unique_id: extractor_bano_ha_al_mando
        icon: mdi:account-tie
        state: >
          {{ is_state('input_boolean.extractor_bano_control_ha', 'on')
             and has_value('sensor.temperatura_bano_humidity')
             and has_value('fan.ventilacion_mecanica') }}

# ------------------------------------------------------------
# COMUNICACIÓN CON EL SHELLY
# ------------------------------------------------------------
rest_command:
  extractor_bano_latido:
    url: >-
      http://192.168.2.92/script/1/ha?cmd=latido&alta={{ states('input_number.extractor_bano_humedad_alta') | int }}&baja={{ states('input_number.extractor_bano_humedad_baja') | int }}&purga={{ states('input_number.extractor_bano_purga_min') | int }}&ini={{ (state_attr('input_datetime.extractor_bano_hora_inicio', 'timestamp') | int(0)) // 60 }}&fin={{ (state_attr('input_datetime.extractor_bano_hora_fin', 'timestamp') | int(0)) // 60 }}
    method: get
    timeout: 5
  extractor_bano_liberar:
    url: "http://192.168.2.92/script/1/ha?cmd=liberar"
    method: get
    timeout: 5

# Estado del script del Shelly: modo (ha/local) y lo que ve de los sensores
rest:
  - resource: http://192.168.2.92/script/1/ha
    scan_interval: 30
    timeout: 5
    sensor:
      - name: "Extractor baño modo"
        unique_id: extractor_bano_modo
        icon: mdi:swap-horizontal
        value_template: "{{ value_json.modo }}"
        json_attributes:
          - humedad
          - luz
          - puerta
          - ventana
          - purga
          - alta
          - baja
          - purga_min

# ------------------------------------------------------------
# ACCIONES REUTILIZABLES
# ------------------------------------------------------------
script:
  extractor_bano_iniciar_purga:
    alias: "Extractor baño · iniciar purga"
    icon: mdi:fan-clock
    mode: restart
    sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.ventilacion_mecanica
      - action: timer.start
        target:
          entity_id: timer.extractor_bano_purga
        data:
          duration: >
            {% set m = states('input_number.extractor_bano_purga_min') | int(15) %}
            {{ '%02d:%02d:00' % (m // 60, m % 60) }}

  extractor_bano_apagar:
    alias: "Extractor baño · apagar"
    icon: mdi:fan-off
    mode: restart
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.extractor_bano_purga
      - action: fan.turn_off
        target:
          entity_id: fan.ventilacion_mecanica

  # Misma lógica que evaluar() del Shelly
  extractor_bano_evaluar:
    alias: "Extractor baño · evaluar"
    icon: mdi:fan-auto
    mode: queued
    max: 5
    variables:
      humedad: "{{ states('sensor.temperatura_bano_humidity') | float(none) }}"
      alta: "{{ states('input_number.extractor_bano_humedad_alta') | float(60) }}"
      baja: "{{ states('input_number.extractor_bano_humedad_baja') | float(57) }}"
      luz: "{{ is_state('light.luz_bano', 'on') }}"
      purga_activa: "{{ is_state('timer.extractor_bano_purga', 'active') }}"
      humedad_alta: "{{ humedad is not none and humedad > alta }}"
      humedad_baja: "{{ humedad is not none and humedad < baja }}"
    sequence:
      - choose:
          # 1. Fuera de horario o sin entrada de aire -> apagado
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state('binary_sensor.extractor_bano_en_horario', 'off')
                     or is_state('binary_sensor.extractor_bano_ventilacion_posible', 'off') }}
            sequence:
              - action: script.extractor_bano_apagar

          # 2. Luz encendida + humedad alta -> encender (cancela purga)
          - conditions: "{{ luz and humedad_alta }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.extractor_bano_purga
              - action: fan.turn_on
                target:
                  entity_id: fan.ventilacion_mecanica

          # 3. Luz encendida + humedad baja -> apagar
          #    (entre baja y alta no se hace nada: histéresis)
          - conditions: "{{ luz and humedad_baja }}"
            sequence:
              - action: script.extractor_bano_apagar

          # 4. Luz apagada, sin purga y humedad alta -> purga
          - conditions: "{{ not luz and not purga_activa and humedad_alta }}"
            sequence:
              - action: script.extractor_bano_iniciar_purga

          # 5. Luz apagada, sin purga y sin necesidad -> apagado
          - conditions: "{{ not luz and not purga_activa }}"
            sequence:
              - action: script.extractor_bano_apagar

  # Aviso por voz generado por IA cuando el extractor no puede ventilar bien.
  #   tipo = ventana_o_puerta -> A/C apagado: abrir ventana o dejar puerta abierta
  #   tipo = abrir_ventana    -> A/C encendido: abrir la ventana (la puerta no vale,
  #                              el extractor se llevaría el aire climatizado)
  extractor_bano_aviso_ventilacion:
    alias: "Extractor baño · aviso de ventilación (IA)"
    icon: mdi:account-voice
    mode: single
    max_exceeded: silent
    fields:
      tipo:
        name: Tipo de aviso
        description: "abrir_ventana (A/C encendido) o ventana_o_puerta (A/C apagado)"
        required: true
        example: ventana_o_puerta
        selector:
          select:
            options:
              - abrir_ventana
              - ventana_o_puerta
    variables:
      estilos:
        - narrador deportivo
        - presentador de telediario
        - documental de naturaleza
        - tráiler de película épica
        - anuncio de teletienda
        - parte meteorológico
        - operador de atención al cliente
        - investigador privado
      situacion: >-
        {%- if tipo == 'abrir_ventana' -%}
        Alguien acaba de salir del baño. El aire acondicionado de la casa está
        encendido y la ventana del baño está cerrada, así que el extractor se está
        llevando el aire fresco de la casa en lugar de aire de la calle.
        {%- else -%}
        Alguien acaba de salir del baño y ha cerrado la puerta con la ventana
        también cerrada, así que el extractor no tiene por dónde coger aire y no
        puede sacar la humedad.
        {%- endif -%}
      peticion: >-
        {%- if tipo == 'abrir_ventana' -%}
        que abran la ventana del baño
        {%- else -%}
        que abran la ventana del baño o dejen la puerta del baño abierta
        {%- endif -%}
      aviso_fallback: >-
        {%- if tipo == 'abrir_ventana' -%}
        Atención. El aire acondicionado está encendido y la ventana del baño está
        cerrada. Abrid la ventana para que el extractor no se lleve el aire fresco
        de la casa.
        {%- else -%}
        Atención. La puerta y la ventana del baño están cerradas y el extractor no
        tiene por dónde coger aire. Abrid la ventana o dejad la puerta abierta.
        {%- endif -%}
    sequence:
      - variables:
          ai_message: {}
          estilo: "{{ estilos | random }}"
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          entity_id: ai_task.openai_ai_task
          task_name: aviso_extractor_bano
          instructions: >
            Genera un aviso corto para reproducir por voz en una vivienda.

            Situación: {{ situacion }}

            Lo que hay que pedir: {{ peticion }}.

            Estilo narrativo obligatorio para este mensaje: {{ estilo }}.

            Requisitos:

            - Español de España. Máximo 2 frases cortas.

            - Deja claro qué hay que hacer: {{ peticion }}.

            - Humor inteligente, ironía o sarcasmo suave: baño convertido en sauna,
              extractor ahogándose, humedad okupa o similar.

            - Debe sonar natural leído en voz alta.

            - Sin emojis, sin comillas y sin explicaciones fuera del mensaje.
        response_variable: ai_message
      - variables:
          mensaje: |-
            {% if ai_message.data is defined and ai_message.data is string
                  and ai_message.data | trim != '' %}
              {{ ai_message.data | trim }}
            {% else %}
              {{ aviso_fallback }}
            {% endif %}
      - action: tts.speak
        target:
          entity_id: tts.openai_tts_openai_tts_gpt_40_mini
        data:
          cache: false
          media_player_entity_id:
            - media_player.bano
            - media_player.google_nest_hub_cocina
          message: "{{ mensaje }}"
          language: es

# ------------------------------------------------------------
# AUTOMATIZACIONES
# ------------------------------------------------------------
automation:
  # Latido: mantiene a HA al mando y pasa la configuración al Shelly
  - id: extractor_bano_latido
    alias: "Extractor baño · latido al Shelly"
    description: >
      Cada minuto avisa al Shelly de que HA manda y le envía la configuración.
      Si HA deja de estar al mando, le devuelve el control inmediatamente.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.extractor_bano_ha_al_mando
      - trigger: state
        entity_id:
          - input_number.extractor_bano_humedad_alta
          - input_number.extractor_bano_humedad_baja
          - input_number.extractor_bano_purga_min
          - input_datetime.extractor_bano_hora_inicio
          - input_datetime.extractor_bano_hora_fin
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.extractor_bano_ha_al_mando
            state: "on"
        then:
          - action: rest_command.extractor_bano_latido
            response_variable: resp
            continue_on_error: true
          # Si el Shelly venía de modo local, HA re-evalúa al recuperar el mando
          - if:
              - condition: template
                value_template: >
                  {{ resp is defined and resp.status == 200
                     and resp.content is mapping
                     and resp.content.modo_previo == 'local' }}
            then:
              - action: script.extractor_bano_evaluar
        else:
          - action: rest_command.extractor_bano_liberar
            continue_on_error: true

  # Control del extractor cuando HA está al mando
  - id: extractor_bano_control
    alias: "Extractor baño · control"
    description: >
      Lógica del extractor con HA al mando. Si HA no responde, el script
      del Shelly ejecuta la misma lógica en local.
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.temperatura_bano_humidity
        id: humedad
      - trigger: state
        entity_id: light.luz_bano
        to: "on"
        id: luz_on
      - trigger: state
        entity_id: light.luz_bano
        to: "off"
        id: luz_off
      - trigger: state
        entity_id:
          - binary_sensor.extractor_bano_ventilacion_posible
          - binary_sensor.extractor_bano_en_horario
          - binary_sensor.extractor_bano_ha_al_mando
          - input_number.extractor_bano_humedad_alta
          - input_number.extractor_bano_humedad_baja
        id: condiciones
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.extractor_bano_purga
        id: fin_purga
    conditions:
      - condition: state
        entity_id: binary_sensor.extractor_bano_ha_al_mando
        state: "on"
    actions:
      - choose:
          # Al apagar la luz: purga (si hay horario, entrada de aire y no hay purga ya)
          - conditions:
              - condition: trigger
                id: luz_off
              - condition: state
                entity_id: binary_sensor.extractor_bano_en_horario
                state: "on"
              - condition: state
                entity_id: binary_sensor.extractor_bano_ventilacion_posible
                state: "on"
              - condition: state
                entity_id: timer.extractor_bano_purga
                state: "idle"
            sequence:
              - action: script.extractor_bano_iniciar_purga

          # Fin de purga con luz apagada y humedad aún alta: otra purga
          - conditions:
              - condition: trigger
                id: fin_purga
              - condition: template
                value_template: >
                  {{ is_state('light.luz_bano', 'off')
                     and is_state('binary_sensor.extractor_bano_en_horario', 'on')
                     and is_state('binary_sensor.extractor_bano_ventilacion_posible', 'on')
                     and states('sensor.temperatura_bano_humidity') | float(0)
                         > states('input_number.extractor_bano_humedad_alta') | float(60) }}
            sequence:
              - action: script.extractor_bano_iniciar_purga

        # Resto de casos: lógica general
        default:
          - action: script.extractor_bano_evaluar

  # Aviso al salir del baño si el extractor se queda sin entrada de aire adecuada
  - id: extractor_bano_aviso_ventilacion
    alias: "Extractor baño · aviso de ventilación al salir"
    description: >
      Tras apagar la luz (salida del baño), avisa por voz si la ventilación no es
      adecuada. A/C apagado: puerta y ventana cerradas -> abrir una de las dos.
      A/C encendido: ventana cerrada -> abrir la ventana (aunque la puerta esté
      abierta, para no extraer aire climatizado).
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: light.luz_bano
        to: "off"
        for: "00:00:20"
      - trigger: state
        entity_id: binary_sensor.puerta_del_bano_window
        to: "off"
        for: "00:00:20"
    variables:
      ac_encendido: "{{ states('climate.casa') not in ['off', 'unavailable', 'unknown'] }}"
      tipo: "{{ 'abrir_ventana' if ac_encendido else 'ventana_o_puerta' }}"
    conditions:
      # El extractor solo actúa en horario
      - condition: state
        entity_id: binary_sensor.extractor_bano_en_horario
        state: "on"
      - condition: state
        entity_id: light.luz_bano
        state: "off"
      - condition: state
        entity_id: binary_sensor.ventana_bano_ventana
        state: "off"
      # Solo justo después de salir (luz apagada hace menos de 5 min)
      - condition: template
        value_template: >
          {{ (now() - states.light.luz_bano.last_changed).total_seconds() < 300 }}
      # A/C apagado: además la puerta tiene que estar cerrada
      - condition: template
        value_template: >
          {{ ac_encendido or is_state('binary_sensor.puerta_del_bano_window', 'off') }}
      # Un solo aviso por salida (luz off + cierre de puerta no avisan dos veces)
      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 300 }}
    actions:
      - action: script.extractor_bano_aviso_ventilacion
        data:
          tipo: "{{ tipo }}"
