- id: '1777587625762'
  alias: Carga bateria en Valle automatica v2.3
  description: 'v2.3: forecast_tomorrow en ventana nocturna (00:00-08:00) para evitar
    infravaloración de Solcast a medianoche. forecast_today desde las 08:00 en adelante.'
  triggers:
  - hours: /1
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_boolean.carga_bateria_tarifa_valle
    state: 'on'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - after: 00:00:00
        before: 08:00:00
        condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: and
      conditions:
      - after: 00:00:00
        before: 09:00:00
        condition: time
        weekday:
        - sat
        - sun
  - condition: template
    value_template: "{% if now().hour < 8 %}\n  {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
      not in ['unknown', 'unavailable', 'none'] }}\n{% else %}\n  {{ states('sensor.solcast_pv_forecast_forecast_today')
      not in ['unknown', 'unavailable', 'none'] }}\n{% endif %}\n"
  actions:
  - variables:
      forecast_ref: "{% if now().hour < 8 %}\n  {{ states('sensor.solcast_pv_forecast_forecast_tomorrow')
        | float(0) }}\n{% else %}\n  {{ states('sensor.solcast_pv_forecast_forecast_today')
        | float(0) }}\n{% endif %}\n"
      sensor_usado: '{% if now().hour < 8 %}forecast_tomorrow{% else %}forecast_today{%
        endif %}'
      soc_actual: '{{ states(''sensor.gx_device_dc_battery_charge'') | float(0) }}'
      solcast_obsoleto: "{% set last = states('sensor.solcast_pv_forecast_api_last_polled')
        %}\n{% if last in ['unknown', 'unavailable', 'none'] %}\n  true\n{% else %}\n
        \ {{ (now() - (last | as_datetime)).total_seconds() > 21600 }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ solcast_obsoleto }}'
      sequence:
      - action: logbook.log
        data:
          name: Carga Valle
          message: '⚠️ Solcast obsoleto (>6h). Sensor: {{ sensor_usado }}, Forecast:
            {{ forecast_ref }} kWh, SOC: {{ soc_actual }}%.'
      - if:
        - condition: template
          value_template: '{{ forecast_ref > 30 }}'
        then:
        - action: logbook.log
          data:
            name: Carga Valle
            message: Forecast alto (>30 kWh) pese a datos obsoletos. Sin carga forzada.
        - action: select.select_option
          data:
            option: BL_DISABLED
          target:
            entity_id: select.gx_device_ess_batterylife_state
        - action: number.set_value
          data:
            value: '100'
          target:
            entity_id: number.gx_device_ess_max_charge_current
        else:
        - action: logbook.log
          data:
            name: Carga Valle
            message: Forecast bajo/incierto con datos obsoletos. Cargando hasta 95%
              (peor caso).
        - if:
          - condition: template
            value_template: '{{ soc_actual < 95 }}'
          then:
          - action: select.select_option
            data:
              option: KEEP_BATTERIES_CHARGED
            target:
              entity_id: select.gx_device_ess_batterylife_state
          - continue_on_timeout: true
            timeout: 07:00:00
            wait_for_trigger:
            - entity_id: select.octopus_energy_contador
              to: Llano
              trigger: state
            - above: 95
              entity_id: sensor.gx_device_dc_battery_charge
              trigger: numeric_state
          - action: select.select_option
            data:
              option: BL_DISABLED
            target:
              entity_id: select.gx_device_ess_batterylife_state
          - action: number.set_value
            data:
              value: '100'
            target:
              entity_id: number.gx_device_ess_max_charge_current
    - alias: 'Rama 1: forecast < 20 kWh → cargar hasta 95%'
      conditions:
      - condition: template
        value_template: '{{ forecast_ref < 20 }}'
      sequence:
      - action: logbook.log
        data:
          name: Carga Valle
          message: 'Rama 1 (forecast bajo). Sensor: {{ sensor_usado }}, Forecast:
            {{ forecast_ref }} kWh, SOC: {{ soc_actual }}%. Objetivo: 95%.'
      - if:
        - condition: template
          value_template: '{{ soc_actual < 95 }}'
        then:
        - action: select.select_option
          data:
            option: KEEP_BATTERIES_CHARGED
          target:
            entity_id: select.gx_device_ess_batterylife_state
        - continue_on_timeout: true
          timeout: 07:00:00
          wait_for_trigger:
          - entity_id: select.octopus_energy_contador
            to: Llano
            trigger: state
          - above: 95
            entity_id: sensor.gx_device_dc_battery_charge
            trigger: numeric_state
        - action: select.select_option
          data:
            option: BL_DISABLED
          target:
            entity_id: select.gx_device_ess_batterylife_state
        - action: number.set_value
          data:
            value: '100'
          target:
            entity_id: number.gx_device_ess_max_charge_current
        else:
        - action: logbook.log
          data:
            name: Carga Valle
            message: SOC ya supera 95%. Sin carga adicional.
        - action: select.select_option
          data:
            option: BL_DISABLED
          target:
            entity_id: select.gx_device_ess_batterylife_state
    - alias: 'Rama 2: forecast 20-30 kWh → cargar hasta 80%'
      conditions:
      - condition: template
        value_template: '{{ forecast_ref >= 20 and forecast_ref < 30 }}'
      sequence:
      - action: logbook.log
        data:
          name: Carga Valle
          message: 'Rama 2 (forecast moderado). Sensor: {{ sensor_usado }}, Forecast:
            {{ forecast_ref }} kWh, SOC: {{ soc_actual }}%. Objetivo: 80%.'
      - if:
        - condition: template
          value_template: '{{ soc_actual < 80 }}'
        then:
        - action: select.select_option
          data:
            option: KEEP_BATTERIES_CHARGED
          target:
            entity_id: select.gx_device_ess_batterylife_state
        - continue_on_timeout: true
          timeout: 07:00:00
          wait_for_trigger:
          - entity_id: select.octopus_energy_contador
            to: Llano
            trigger: state
          - above: 80
            entity_id: sensor.gx_device_dc_battery_charge
            trigger: numeric_state
        - action: select.select_option
          data:
            option: BL_DISABLED
          target:
            entity_id: select.gx_device_ess_batterylife_state
        - action: number.set_value
          data:
            value: '100'
          target:
            entity_id: number.gx_device_ess_max_charge_current
        else:
        - action: logbook.log
          data:
            name: Carga Valle
            message: SOC ya supera 80%. Sin carga adicional.
        - action: select.select_option
          data:
            option: BL_DISABLED
          target:
            entity_id: select.gx_device_ess_batterylife_state
    - alias: 'Rama 3: forecast >= 30 kWh → sin carga forzada'
      conditions:
      - condition: template
        value_template: '{{ forecast_ref >= 30 }}'
      sequence:
      - action: logbook.log
        data:
          name: Carga Valle
          message: 'Rama 3 (forecast alto). Sensor: {{ sensor_usado }}, Forecast:
            {{ forecast_ref }} kWh. Sin carga forzada.'
      - action: select.select_option
        data:
          option: BL_DISABLED
        target:
          entity_id: select.gx_device_ess_batterylife_state
      - action: number.set_value
        data:
          value: '100'
        target:
          entity_id: number.gx_device_ess_max_charge_current
  mode: single
  trace:
    stored_traces: 50
