- id: '1772791528126'
  alias: Informe diario de Raquel 2
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - light.luz_cocina
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ state_attr(''automation.informe_diario_de_raquel_2'', ''last_triggered'')
      == None or (state_attr(''automation.informe_diario_de_raquel_2'', ''last_triggered'')
      | as_local).date() != now().date() }}'
  - condition: time
    after: 07:16:00
  actions:
  - action: media_player.turn_on
    target:
      entity_id: media_player.google_nest_hub_cocina
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
    enabled: false
  - action: calendar.get_events
    target:
      entity_id: calendar.familia
    data:
      start_date_time: '{{ today_at(''00:00:00'') }}'
      end_date_time: '{{ today_at(''23:59:59'') }}'
    response_variable: eventos_hoy
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.openai_ai_task
      task_name: saludo_mananero
      instructions: "Hola asistente. Genera un saludo de \"Buenos días\" original
        e inteligente para Raquel, para decírselo hoy por la mañana.\nMenciona una
        curiosidad breve del día de hoy, un evento histórico interesante o una efeméride.
        \nEl tono debe ser relajado, agradable y con un punto de humor sutil, sin
        exceso de euforia, ya que es temprano. Trátala con cariño.\nMUY IMPORTANTE:
        NO uses la frase literal \"Buenos días Raquel\", empieza directamente con
        la frase.\nMáximo 2-3 frases cortas en total."
    response_variable: ai_message
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.openai_ai_task
      task_name: despedida_cine
      instructions: Genera una frase de despedida para Raquel de parte de su marido
        Rogelio, usando un humor adulto, sugerente y muy pícaro. No uses lenguaje
        explícitamente pornográfico para no violar las normas de seguridad, pero sí
        metáforas muy evidentes sobre sexo. Dile que esta noche le espera una sesión
        intensa de pasión en la cama, usando bromas de doble sentido, insinuaciones
        claras de que la va a poner fina, o referencias divertidas y atrevidas. Solo
        la frase directa, sin introducciones.
    response_variable: ai_quote
  - action: tts.speak
    metadata: {}
    data:
      cache: true
      media_player_entity_id: media_player.google_nest_hub_cocina
      message: "{% set weather_translation = {\n  'clear-night': 'noche despejada',\n
        \ 'cloudy': 'nublado',\n  'fog': 'niebla',\n  'hail': 'granizo',\n  'lightning':
        'tormenta eléctrica',\n  'lightning-rainy': 'tormenta eléctrica con lluvia',\n
        \ 'partlycloudy': 'parcialmente nublado',\n  'pouring': 'lluvia intensa',\n
        \ 'rainy': 'lluvioso',\n  'snowy': 'nevado',\n  'snowy-rainy': 'nieve con
        lluvia',\n  'sunny': 'soleado',\n  'windy': 'ventoso',\n  'windy-variant':
        'ventoso con nubes',\n  'exceptional': 'excepcional'\n} %} Buenos días. {{
        ai_message.data }} Hoy el clima estará {{ weather_translation[states('weather.pirateweather')]
        }}, con una temperatura exterior de {{ state_attr('weather.pirateweather','temperature')
        }} grados. La temperatura media dentro de casa es de {{ states('sensor.temperatura_media_en_casa')
        }} grados. La batería ha amanecido al {{ states('sensor.gx_device_dc_battery_charge')
        | float | round(0) }} por ciento. Se esperan {{ states('sensor.solcast_pv_forecast_forecast_today')
        | float | round(1) }} kilovatios hora de solar, con el pico máximo previsto
        a las {{ as_timestamp(states('sensor.solcast_pv_forecast_peak_time_today'))
        | timestamp_custom('%H:%M') }}. Agenda: {% set lista_eventos = eventos_hoy['calendar.familia']['events']
        %} {% if lista_eventos | length == 0 %}\n  Hoy no tienes eventos programados.\n{%
        else %}\n  Tienes {{ lista_eventos | length }} eventos. \n  {% for evento
        in lista_eventos %}\n    {% if 'T' in evento.start %}\n      A las {{ as_timestamp(evento.start)
        | timestamp_custom('%H:%M') }}, {{ evento.summary }}.\n    {% else %}\n      Todo
        el día, {{ evento.summary }}.\n    {% endif %}\n  {% endfor %}\n{% endif %}
        Y para terminar: {{ ai_quote.data }}"
    enabled: true
    target:
      entity_id: tts.openai_tts
  mode: single
