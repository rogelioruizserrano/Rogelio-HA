- id: '1741563109826'
  alias: Notificación de batería baja
  description: Envía una notificación persistente con TODOS los dispositivos que tienen
    batería por debajo del 15% (excluyendo Apple).
  triggers:
  - entity_id: []
    trigger: state
    attribute: battery
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state | float < 15 }}'
  actions:
  - data:
      title: ⚠️ Dispositivos con batería baja (<15%)
      message: "{% set ns = namespace(devices=[]) %}\n{% for state in states.sensor
        | selectattr('attributes.device_class', 'eq', 'battery') %}\n  {% if (state.state
        | float(99) < 15) and not (('iphone' in state.entity_id.lower() or 'ipad'
        in state.entity_id.lower() or 'apple' in state.entity_id.lower() or 'watch'
        in state.entity_id.lower()) or ('iPhone' in state.name or 'iPad' in state.name
        or 'Apple' in state.name or 'Watch' in state.name)) %}\n    {% set ns.devices
        = ns.devices + [state.name + ': ' + state.state + '%'] %}\n  {% endif %}\n{%
        endfor %}\n{% if ns.devices %}\nDispositivos con batería baja:\n{{ ns.devices
        | join('\n') }}\n{% else %}\nNo hay dispositivos con batería baja en este
        momento.\n{% endif %}"
      notification_id: bateria_baja_persistente
    action: persistent_notification.create
  - data:
      title: ⚠️ Dispositivos con batería baja (<15%)
      message: "{% set ns = namespace(devices=[]) %}\n{% for state in states.sensor
        | selectattr('attributes.device_class', 'eq', 'battery') %}\n  {% if (state.state
        | float(99) < 15) and not (('iphone' in state.entity_id.lower() or 'ipad'
        in state.entity_id.lower() or 'apple' in state.entity_id.lower() or 'watch'
        in state.entity_id.lower()) or ('iPhone' in state.name or 'iPad' in state.name
        or 'Apple' in state.name or 'Watch' in state.name)) %}\n    {% set ns.devices
        = ns.devices + [state.name + ': ' + state.state + '%'] %}\n  {% endif %}\n{%
        endfor %}\n{% if ns.devices %}\nDispositivos con batería baja:\n{{ ns.devices
        | join('\n') }}\n{% else %}\nNo hay dispositivos con batería baja en este
        momento.\n{% endif %}"
    action: notify.mobile_app_iphone_de_rogelio_ruiz_serrano
  mode: parallel
