- id: '1762715606028'
  alias: MQTT - Publicar sensores Victron consolidado
  description: Consolidación de publicaciones MQTT
  triggers:
  - trigger: state
    entity_id:
    - sensor.red_total
    - sensor.gx_device_pv_on_output_power_l1
    - sensor.gx_device_dc_battery_charge
    - sensor.consumo_de_la_casa
    - sensor.gx_device_dc_battery_power
  - trigger: time_pattern
    seconds: /5
  conditions:
  - condition: template
    value_template: '{{ cfg is defined and cfg is not none or trigger.platform ==
      ''time_pattern'' }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''state'' }}'
      sequence:
      - condition: template
        value_template: '{{ trigger.to_state.state | float(default=None) is not none
          }}'
      - data:
          topic: '{{ cfg.topic }}'
          payload: "{% set dec = cfg.decimals | default(0) %} {% set v = trigger.to_state.state
            | float %} {% if dec == 0 %}\n  {{ v | round(0) | int }}\n{% else %}\n
            \ {{ v | round(dec) }}\n{% endif %}"
        action: mqtt.publish
    - conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''time_pattern'' }}'
      sequence:
      - data:
          topic: R/c0619ab31957/system/0/Serial
          payload: ''
        action: mqtt.publish
  mode: queued
  max: 50
  variables:
    publish_map:
    - entity_id: sensor.red_total
      topic: Inverter/GridWatts
      decimals: 0
    - entity_id: sensor.gx_device_pv_on_output_power_l1
      topic: Inverter/PvWattsTotal
      decimals: 0
    - entity_id: sensor.gx_device_dc_battery_charge
      topic: Inverter/BatterySOC
      decimals: 0
    - entity_id: sensor.consumo_de_la_casa
      topic: Inverter/LoadWatts
      decimals: 0
    - entity_id: sensor.gx_device_dc_battery_power
      topic: Inverter/BatteryWatts
      decimals: 0
