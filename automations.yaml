- id: '1705428169775'
  alias: Ajustar corriente carga según consumo red (mejorado con sensores del sistema)
  description: 'Ajusta number.settings_ess_maxchargecurrent (A DC) para que el consumo
    de red no supere 4600W, usando el consumo de la casa y la tensión de batería.

    '
  triggers:
  - entity_id: sensor.gx_device_grid_power_l1
    trigger: state
  - entity_id: sensor.gx_device_dc_battery_voltage
    trigger: state
  - entity_id: input_boolean.carga_bateria_tarifa_valle
    trigger: state
  - entity_id: sensor.gx_device_ac_active_input_source
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.carga_bateria_tarifa_valle
      state: 'on'
    - condition: state
      entity_id: select.gx_device_ess_batterylife_state
      state: KEEP_BATTERIES_CHARGED
    - condition: state
      entity_id: sensor.gx_device_ac_active_input_source
      state: GRID
  actions:
  - target:
      entity_id: number.gx_device_ess_max_charge_current
    data:
      value: "{%- set grid_limit     = 6600  -%}  {# límite de consumo en red (W)
        #} {%- set inverter_eff   = 0.92  -%}  {# rendimiento AC↔DC aproximado #}
        {%- set max_amps       = 70    -%} {%- set min_amps       = 0     -%}\n{#
        Consumo de la casa en AC, excluyendo carga de batería #} {%- set house_power
        = states('sensor.shellyem_244cab418bca_channel_1_power') | float(0) -%} {%-
        if house_power < 0 -%}\n  {%- set house_power = 0 -%}\n{%- endif -%}\n{# Tensión
        actual de batería (DC) #} {%- set v_bat = states('sensor.gx_device_dc_battery_voltage')
        | float(52) -%} {%- if v_bat < 40 -%}\n  {# seguridad ante lecturas raras
        #}\n  {%- set v_bat = 52 -%}\n{%- endif -%}\n{# Potencia AC disponible para
        cargar batería sin superar grid_limit #} {%- set p_charge_ac_target = grid_limit
        - house_power -%} {%- if p_charge_ac_target < 0 -%}\n  {%- set p_charge_ac_target
        = 0 -%}\n{%- endif -%}\n{# Potencia DC objetivo para la batería (considerando
        rendimiento) #} {%- set p_charge_dc_target = p_charge_ac_target * inverter_eff
        -%}\n{# Corriente DC necesaria para esa potencia #} {%- set amps = (p_charge_dc_target
        / v_bat) | float(0) -%}\n{# Limitar al rango físico #} {%- if amps < min_amps
        -%}\n  {%- set amps = min_amps -%}\n{%- elif amps > max_amps -%}\n  {%- set
        amps = max_amps -%}\n{%- endif -%}\n{{ amps | round(0, 'floor') }}\n"
    action: number.set_value
  mode: restart
- id: '1706564885432'
  alias: Termos invierno con tarifas
  description: ''
  triggers:
  - minutes: /30
    trigger: time_pattern
  - trigger: numeric_state
    entity_id: sensor.bateria_basen_charge
    above: 99
  - trigger: numeric_state
    entity_id: sensor.shellyem_244cab418bca_channel_1_power
    above: 0
  - trigger: numeric_state
    entity_id: sensor.shellyem_244cab418bca_channel_1_power
    below: -3000
  conditions:
  - condition: state
    entity_id: input_boolean.termos_modo_invierno
    state: 'on'
  actions:
  - choose:
    - alias: Prevision < 35 kWh → AUTO
      conditions:
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_today
        below: 35
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.termo_50l_modo
          - input_select.termo_100l_modo
        data:
          option: AUTO
    - alias: Prevision >= 35 kWh y bateria < 99% → OFF
      conditions:
      - condition: numeric_state
        entity_id: sensor.bateria_basen_charge
        below: 99
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.termo_50l_modo
          - input_select.termo_100l_modo
        data:
          option: 'OFF'
    - alias: Bateria >= 99% y excedentes > 3000W → MANUAL
      conditions:
      - condition: numeric_state
        entity_id: sensor.shellyem_244cab418bca_channel_1_power
        below: -3000
      sequence:
      - action: input_select.select_option
        target:
          entity_id:
          - input_select.termo_50l_modo
          - input_select.termo_100l_modo
        data:
          option: MANUAL
    default:
    - action: input_select.select_option
      target:
        entity_id:
        - input_select.termo_50l_modo
        - input_select.termo_100l_modo
      data:
        option: AUTO
  mode: single
