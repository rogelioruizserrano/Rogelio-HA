- id: '1779873881301'
  alias: Salón - LED rebote por pulsaciones
  description: 'Cada single_push cambia el brillo en pasos. Al llegar al máximo invierte
    y baja; al llegar al mínimo vuelve a subir. Para al dejar de pulsar.

    '
  triggers:
  - trigger: state
    entity_id: event.pulsadores_entrada_2
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.event_type == ''single_push''
      }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.led_salon_nivel
    data:
      value: '{{ objetivo }}'
  - action: light.turn_on
    target:
      entity_id: light.led_salon
    data:
      brightness_pct: '{{ objetivo }}'
      transition: 0.4
  - if:
    - condition: template
      value_template: '{{ objetivo | int >= maximo }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.led_salon_subiendo
  - if:
    - condition: template
      value_template: '{{ objetivo | int <= minimo }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.led_salon_subiendo
  mode: queued
  max: 15
  variables:
    paso: 20
    minimo: 20
    maximo: 100
    subiendo: '{{ is_state(''input_boolean.led_salon_subiendo'',''on'') }}'
    actual: '{{ states(''input_number.led_salon_nivel'') | int(maximo) }}'
    objetivo: '{% if subiendo %}{{ [actual + paso, maximo] | min }} {% else %}{{ [actual
      - paso, minimo] | max }}{% endif %}

      '
