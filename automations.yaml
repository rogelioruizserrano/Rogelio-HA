- id: '1783374838333'
  alias: Toldos control automático
  description: Apertura/cierre programado y reapertura tras mejora del tiempo
  triggers:
  - trigger: time
    at: '11:00:00'
    id: abrir_programado
  - trigger: time
    at: '16:00:00'
    id: cerrar_programado
  - trigger: numeric_state
    entity_id: sensor.pirateweather_wind_speed
    above: 30
    id: seguridad
  - trigger: numeric_state
    entity_id: sensor.pirateweather_wind_gust
    above: 45
    id: seguridad
  - trigger: numeric_state
    entity_id: sensor.pirateweather_precip_intensity
    above: 0
    id: seguridad
  - trigger: state
    entity_id: weather.pirateweather
    to:
    - rainy
    - pouring
    - lightning-rainy
    - hail
    id: seguridad
  - trigger: state
    entity_id: weather.pirateweather
    to:
    - sunny
    - partlycloudy
    id: reapertura
  - trigger: numeric_state
    entity_id: sensor.pirateweather_precip_intensity
    below: 0.001
    id: reapertura
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: abrir_programado
      - condition: state
        entity_id: input_boolean.toldos_automaticos
        state: 'on'
      - condition: state
        entity_id: weather.pirateweather
        match: any
        state:
        - sunny
        - partlycloudy
      - condition: numeric_state
        entity_id: sensor.pirateweather_wind_speed
        below: 30
      - condition: numeric_state
        entity_id: sensor.pirateweather_wind_gust
        below: 45
      - condition: numeric_state
        entity_id: sensor.pirateweather_precip_intensity
        below: 0.001
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.toldos
      - action: logbook.log
        data:
          name: Toldos
          message: Apertura programada
    - conditions:
      - condition: trigger
        id: reapertura
      - condition: state
        entity_id: input_boolean.toldos_automaticos
        state: 'on'
      - condition: time
        after: '10:00:00'
        before: '17:00:00'
      - condition: state
        entity_id: weather.pirateweather
        match: any
        state:
        - sunny
        - partlycloudy
      - condition: numeric_state
        entity_id: sensor.pirateweather_precip_intensity
        below: 0.001
      - condition: numeric_state
        entity_id: sensor.pirateweather_wind_speed
        below: 30
      - condition: numeric_state
        entity_id: sensor.pirateweather_wind_gust
        below: 45
      - condition: state
        entity_id: cover.toldos
        state: closed
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.toldos
      - action: logbook.log
        data:
          name: Toldos
          message: Reapertura automática tras mejorar el tiempo
    - conditions:
      - condition: trigger
        id: cerrar_programado
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.toldos
      - action: logbook.log
        data:
          name: Toldos
          message: Cierre programado
    - conditions:
      - condition: trigger
        id: seguridad
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.toldos
      - action: logbook.log
        data:
          name: Toldos
          message: 'Cierre seguridad. Viento={{ states(''sensor.pirateweather_wind_speed'')
            }} km/h, Racha={{ states(''sensor.pirateweather_wind_gust'') }} km/h,
            Lluvia={{ states(''sensor.pirateweather_precip_intensity'') }}, Estado={{
            states(''weather.pirateweather'') }}

            '
  mode: single
- id: conga_salida_matinal
  alias: Aspirador Conga - salida segun dia y presencia
  description: Lun-Jue 10:00 (Rogelio y Rakel fuera). Viernes no. Sabado tarde (15-21)
    y Domingo manana (08-14) en cuanto los 3 esten fuera. Sustituye la cita interna
    del robot (desactivada 2026-07-07).
  triggers:
  - id: lun_jue
    at: '10:00:00'
    trigger: time
  - id: sab_inicio
    at: '15:00:00'
    trigger: time
  - id: dom_inicio
    at: 08:00:00
    trigger: time
  - id: presencia
    entity_id:
    - person.rogelio_ruiz_serrano
    - person.rakel_ruiz_san_martin
    - person.raquel_san_martin_ibanez
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lun_jue
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
      - condition: template
        value_template: '{{ states(''person.rogelio_ruiz_serrano'') != ''home'' and
          states(''person.rakel_ruiz_san_martin'') != ''home'' }}'
      sequence:
      - target:
          entity_id: vacuum.r2d2
        action: vacuum.start
    - conditions:
      - condition: time
        weekday:
        - sat
        after: '15:00:00'
        before: '21:00:00'
      - condition: template
        value_template: '{{ states(''person.rogelio_ruiz_serrano'') != ''home'' and
          states(''person.rakel_ruiz_san_martin'') != ''home'' and states(''person.raquel_san_martin_ibanez'')
          != ''home'' }}'
      - condition: state
        entity_id: vacuum.r2d2
        state: docked
      sequence:
      - target:
          entity_id: vacuum.r2d2
        action: vacuum.start
    - conditions:
      - condition: time
        weekday:
        - sun
        after: 08:00:00
        before: '14:00:00'
      - condition: template
        value_template: '{{ states(''person.rogelio_ruiz_serrano'') != ''home'' and
          states(''person.rakel_ruiz_san_martin'') != ''home'' and states(''person.raquel_san_martin_ibanez'')
          != ''home'' }}'
      - condition: state
        entity_id: vacuum.r2d2
        state: docked
      sequence:
      - target:
          entity_id: vacuum.r2d2
        action: vacuum.start
