      }}'
  actions:
  - repeat:
      while:
      - condition: time
        after: '10:00:00'
        before: '23:00:00'
      - condition: numeric_state
        entity_id: sensor.aire_acondicionado_power
        above: 150
      - condition: template
        value_template: '{{ aberturas | select(''is_state'',''on'') | list | count
          > 0 }}'
      sequence:
      - variables:
          ai_message: {}
          estilo: '{{ estilos | random }}'
          nombres: "{{ expand(aberturas | select('is_state','on') | list)\n   | map(attribute='name')\n
            \  | map('replace', ' Window', '')\n   | map('replace', ' Contact', '')\n
            \  | list }}"
          lista_aberturas: '{%- if nombres | count == 0 -%}alguna puerta o ventana
            {%- elif nombres | count == 1 -%}{{ nombres[0] }} {%- else -%}{{ nombres[:-1]
            | join('', '') ~ '' y '' ~ nombres[-1] }} {%- endif -%}'
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          entity_id: ai_task.openai_ai_task
          task_name: aviso_aire_acondicionado
          instructions: "Genera un aviso corto para reproducir por voz en una vivienda.\nEl
            aire acondicionado está funcionando y siguen abiertas: {{ lista_aberturas
            }}.\nEstilo narrativo obligatorio para este mensaje: {{ estilo }}.\nRequisitos:\n-
            Español de España. Máximo 2 frases cortas.\n- Menciona explícitamente
            las aperturas indicadas.\n- El objetivo es que alguien vaya a cerrarlas.\n-
            Humor inteligente, ironía o sarcasmo suave: enfriar la calle,\n  climatizar
            el barrio, regalar aire acondicionado a los vecinos o similar.\n- Debe
            sonar natural leído en voz alta.\n- Sin emojis, sin comillas y sin explicaciones
            fuera del mensaje.\n"
        response_variable: ai_message
      - variables:
          mensaje: "{% if ai_message.data is defined and ai_message.data is string\n
            \     and ai_message.data | trim != '' %}\n  {{ ai_message.data | trim
            }}\n{% else %}\n  {{ aviso_fallback }}\n{% endif %}"
      - action: tts.speak
        target:
          entity_id: tts.openai_tts_openai_tts_gpt_40_mini
        data:
          cache: false
          media_player_entity_id:
          - media_player.hilo_musical
          - media_player.dormitorio
          message: '{{ mensaje }}'
          language: es
      - wait_template: "{{ aberturas | select('is_state','on') | list | count == 0\n
          \  or states('sensor.aire_acondicionado_power') | float(0) <= 150 }}"
        timeout: 00:15:00
        continue_on_timeout: true
  mode: single
  max_exceeded: silent
  variables:
    aberturas:
    - binary_sensor.puerta_del_bano_window
    - binary_sensor.puerta_del_bano_grande_window
    - binary_sensor.puerta_principal_contact
    - binary_sensor.ventana_dormitorio_principal_window
    - binary_sensor.ventana_dormitorio_rakel_window
    - binary_sensor.ventana_salita_window
    - binary_sensor.puerta_del_patio_window
    - binary_sensor.bthome_sensor_7162_window
    estilos:
    - narrador deportivo
    - presentador de telediario
    - documental de naturaleza
    - tráiler de película épica
    - anuncio de teletienda
    - parte meteorológico
    - operador de atención al cliente
    - investigador privado
    aviso_fallback: Atención. Hay puertas o ventanas abiertas mientras el aire acondicionado
      está funcionando. Cerradlas para evitar pérdidas de energía.
- id: '1789598588202'
  alias: Restablecimiento progresivo de cargas
  description: Reconecta cargas deslastradas de una en una según su consumo medido
  triggers:
  - trigger: time_pattern
    minutes: /3
  conditions:
  - condition: template
    value_template: '{% set p = (states(''input_text.deslastre_cargas'') | from_json(default={})).get(''p'')
      %} {{ p is mapping and p | count > 0 }}'
  actions:
  - variables:
      estado: '{{ states(''input_text.deslastre_cargas'') | from_json(default={})
        }}'
      pendientes: '{{ estado.get(''p'', {}) }}'
      siguiente: "{{ orden_restauracion | select('in', pendientes.keys() | list)\n
        \  | list | first | default('') }}"
      previsto: '{{ [ (pendientes.get(siguiente, 0) * factor) | int, minimo_previsto
        ] | max }}'
      red: '{{ states(''sensor.red_total'') | float(99999) }}'
  - condition: template
    value_template: "{{ siguiente != ''\n   and now().timestamp() - estado.get('ts',
      0) > espera_min * 60\n   and red + previsto < margen }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ siguiente == ''aa'' }}'
      sequence:
      - action: climate.set_hvac_mode
        continue_on_error: true
        target:
          entity_id: climate.casa
        data:
          hvac_mode: '{{ estado.get(''m'') or ''cool'' }}'
      - if:
        - condition: template
          value_template: '{{ estado.get(''t'') is number }}'
        then:
        - delay: 00:00:03
        - action: climate.set_temperature
          continue_on_error: true
          target:
            entity_id: climate.casa
          data:
            temperature: '{{ estado.get(''t'') }}'
    default:
    - action: switch.turn_on
      continue_on_error: true
      target:
        entity_id: '{{ cargas[siguiente] }}'
  - variables:
      restantes: '{{ dict(pendientes.items() | rejectattr(''0'', ''eq'', siguiente)
        | list) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.deslastre_cargas
    data:
      value: '{% if restantes | count > 0 %}{{ {''p'': restantes, ''m'': estado.get(''m''),
        ''t'': estado.get(''t''), ''ts'': estado.get(''ts'', 0)} | to_json }}{% endif
        %}'
  - if:
    - condition: template
      value_template: '{{ restantes | count == 0 }}'
    then:
    - action: notify.mobile_app_iphone_de_rogelio_ruiz_serrano
      data:
        title: Consumo energético
        message: Todas las cargas deslastradas se han restablecido.
  mode: single
  max_exceeded: silent
  variables:
    margen: 5500
    factor: 1.2
    minimo_previsto: 300
    espera_min: 5
    cargas:
      aa: climate.casa
      termo: switch.switch_termo_100l_00_00_00_cuartillo_azotea_interior
      rad_cocina: switch.enchufe_radiador_00_00_00_cocina_interior
      rad_salita: switch.radiador_salita
      lavavajillas: switch.lavavajillas
      lavadora: switch.lavadora_sonoff_pow_relay
      secadora: switch.secadora_switch_0
    nombres:
      aa: el aire acondicionado
      termo: el termo
      rad_cocina: el radiador de la cocina
      rad_salita: el radiador de la salita
      lavavajillas: el lavavajillas
      lavadora: la lavadora
      secadora: la secadora
    orden_restauracion:
    - secadora
    - lavadora
    - lavavajillas
    - rad_salita
    - rad_cocina
    - termo
    - aa
- id: '1790894290111'
  alias: Backup config a GitHub
  triggers:
  - trigger: time
    at: 03:15:00
  actions:
  - action: shell_command.git_push
    response_variable: git
  - if:
    - condition: template
      value_template: '{{ git.returncode != 0 }}'
    then:
    - action: notify.notify
      data:
        title: Git push falló
        message: '{{ git.stderr or git.stdout }}'
  mode: single
