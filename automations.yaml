- id: '1696677357517'
  alias: Notificaciones exceso de consumo de la red v4
  description: Avisos escalonados y deslastre progresivo basado en consumo real
  triggers:
  - trigger: numeric_state
    entity_id: sensor.red_total
    above: 5700
    for: 00:02:00
    id: nivel_1
  - trigger: numeric_state
    entity_id: sensor.red_total
    above: 6700
    for: 00:01:00
    id: nivel_2
  conditions: []
  actions:
  - variables:
      potencia: '{{ states(''sensor.red_total'') | float(0) | round(0) | int }}'
      horario_voz: '{{ today_at(''09:00'') <= now() < today_at(''22:00'') }}'
      instrucciones: ''
      fallback: ''
      apagados: []
  - choose:
    - conditions:
      - condition: trigger
        id: nivel_2
      - condition: numeric_state
        entity_id: sensor.red_total
        above: 6700
      sequence:
      - variables:
          previo: '{{ states(''input_text.deslastre_cargas'') | from_json(default={})
            }}'
          pendientes: '{{ previo.get(''p'', {}) if previo.get(''p'') is mapping else
            {} }}'
          modo_aa: '{{ previo.get(''m'', '''') }}'
          temp_aa: '{{ previo.get(''t'', none) }}'
          base: 0
          liberado: 0
      - repeat:
          sequence:
          - variables:
              base: '{{ states(''sensor.red_total'') | float(0) }}'
              liberado: 0
          - repeat:
              for_each: '{{ orden_deslastre }}'
              sequence:
              - variables:
                  ent: '{{ cargas[repeat.item] }}'
                  w: '{{ states(medidores[repeat.item]) | float(1000) | round(0) |
                    int }}'
              - if:
                - condition: template
                  value_template: "{{ (base - liberado) > objetivo\n   and states(ent)
                    not in ['off', 'unavailable', 'unknown']\n   and w >= minimo_w
                    }}"
                then:
                - if:
                  - condition: template
                    value_template: '{{ repeat.item == ''aa'' }}'
                  then:
                  - variables:
                      modo_aa: '{{ states(ent) }}'
                      temp_aa: '{{ state_attr(ent, ''temperature'') }}'
                - action: homeassistant.turn_off
                  continue_on_error: true
                  target:
                    entity_id: '{{ ent }}'
                - variables:
                    liberado: '{{ liberado + w }}'
                    apagados: '{{ apagados + [repeat.item] }}'
                    pendientes: '{{ dict(pendientes.items() | list + [(repeat.item,
                      w)]) }}'
                - action: input_text.set_value
                  target:
                    entity_id: input_text.deslastre_cargas
                  data:
                    value: "{{ {'p': pendientes, 'm': modo_aa, 't': temp_aa,\n    'ts':
                      now().timestamp() | int} | to_json }}"
                - delay: 00:00:02
          - delay: 00:00:10
          until:
          - condition: template
            value_template: "{{ states('sensor.red_total') | float(0) <= objetivo\n
              \  or repeat.index >= 2 }}"
      - variables:
          potencia_final: '{{ states(''sensor.red_total'') | float(0) | round(0) |
            int }}'
          nombres_apagados: '{% set ns = namespace(l=[]) %} {% for k in apagados |
            unique %}{% set ns.l = ns.l + [nombres[k]] %}{% endfor %} {{ ns.l | join('',
            '') }}'
      - action: notify.mobile_app_iphone_de_rogelio_ruiz_serrano
        data:
          title: Consumo energético CRÍTICO
          message: 'Pico de {{ potencia }} W. {% if apagados | count > 0 %}Apagado:
            {{ nombres_apagados }}. Ahora {{ potencia_final }} W.{% else %}Ninguna
            carga controlable estaba consumiendo.{% endif %} {% if potencia_final
            > objetivo %} ¡Sigue alto!{% endif %}'
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
      - variables:
          instrucciones: 'Escribe un aviso de emergencia con humor exagerado y dramático:
            el consumo eléctrico ha llegado a {{ potencia }} vatios. {% if apagados
            | count > 0 %}Para que no salten los plomos se han apagado automáticamente:
            {{ nombres_apagados }}. Menciónalos. {% else %}Pide que apaguen aparatos
            ya mismo.{% endif %} {{ reglas_voz }}'
          fallback: Atención. Consumo eléctrico crítico de {{ potencia }} vatios.
            {% if apagados | count > 0 %}Se ha apagado {{ nombres_apagados }}. {%
            else %}Apagad aparatos inmediatamente.{% endif %}
    - conditions:
      - condition: trigger
        id: nivel_1
      - condition: numeric_state
        entity_id: sensor.red_total
        above: 5700
      - condition: template
        value_template: "{{ (as_timestamp(now())\n    - as_timestamp(this.attributes.last_triggered,
          0)) > 600 }}"
      sequence:
      - variables:
          mayor: "{% set ns = namespace(k='', w=0) %} {% for k, e in medidores.items()
            %}\n  {% set v = states(e) | float(0) %}\n  {% if v > ns.w %}{% set ns.k
            = k %}{% set ns.w = v %}{% endif %}\n{% endfor %} {{ {'k': ns.k, 'w':
            ns.w | round(0) | int} }}"
          texto_mayor: '{% if mayor.w >= 300 %}El que más consume ahora es {{ nombres[mayor.k]
            }} con {{ mayor.w }} vatios.{% endif %}'
      - action: notify.mobile_app_iphone_de_rogelio_ruiz_serrano
        data:
          title: Consumo energético
          message: 'Exceso de consumo de red: {{ potencia }} W. {{ texto_mayor }}'
      - variables:
          instrucciones: Escribe un aviso sarcástico y gracioso para avisar a la casa
            de que están gastando demasiada luz, {{ potencia }} vatios, y pídeles
            que apaguen algo. {{ texto_mayor }} {% if texto_mayor %}Menciona ese aparato.{%
            endif %} {{ reglas_voz }}
          fallback: Atención. Estamos consumiendo {{ potencia }} vatios de la red.
            {{ texto_mayor }} Apagad algún aparato, por favor.
    default:
    - stop: Sin acción
  - condition: template
    value_template: '{{ horario_voz and instrucciones != '''' }}'
  - variables:
      ai_msg: {}
  - action: ai_task.generate_data
    continue_on_error: true
    data:
      entity_id: ai_task.openai_ai_task
      task_name: aviso_consumo_{{ trigger.id }}
      instructions: '{{ instrucciones }}'
    response_variable: ai_msg
  - action: tts.speak
    target:
      entity_id: tts.openai_tts_openai_tts_gpt_40_mini
    data:
      cache: false
      media_player_entity_id:
      - media_player.hilo_musical
      - media_player.dormitorio
      language: es
      message: "{% if ai_msg.data is defined and ai_msg.data is string\n      and
        ai_msg.data | trim != '' %}\n  {{ ai_msg.data | trim }}\n{% else %}\n  {{
        fallback }}\n{% endif %}"
  mode: parallel
  max: 4
  max_exceeded: silent
  variables:
    objetivo: 6000
    minimo_w: 50
    cargas:
      aa: climate.casa
      termo: switch.switch_termo_100l_00_00_00_cuartillo_azotea_interior
      rad_cocina: switch.enchufe_radiador_00_00_00_cocina_interior
      rad_salita: switch.radiador_salita
      lavavajillas: switch.lavavajillas
      lavadora: switch.lavadora_sonoff_pow_relay
      secadora: switch.secadora_switch_0
    medidores:
      aa: sensor.aire_acondicionado_power
      termo: sensor.switch_termo_100l_00_00_00_cuartillo_azotea_interior_power
      rad_cocina: sensor.radiador_cocina_power
      rad_salita: sensor.radiador_salita_power
      lavavajillas: sensor.lavavajillas_power
      lavadora: sensor.lavadora_sonoff_pow_power
      secadora: sensor.secadora_switch_0_power
    nombres:
      aa: el aire acondicionado
      termo: el termo
      rad_cocina: el radiador de la cocina
      rad_salita: el radiador de la salita
      lavavajillas: el lavavajillas
      lavadora: la lavadora
      secadora: la secadora
    orden_deslastre:
    - aa
    - termo
    - rad_cocina
    - rad_salita
    - lavavajillas
    - lavadora
    - secadora
    reglas_voz: 'Español de España. Máximo 2 frases cortas. No uses comillas, asteriscos,
      emojis ni símbolos: será leído por un sintetizador de voz.'
