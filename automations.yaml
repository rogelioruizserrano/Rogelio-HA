    enabled: true
  action:
  - choose:
    - conditions:
      - condition: sun
        before: sunrise
        after: sunset
        after_offset: '3'
      sequence:
      - action: cover.set_cover_position
        data_template:
          entity_id: cover.shellyplus2pm_b8d61a89c634
          position: "{% set min_temp = 24 %}  {% set max_temp = 26 %}  {% set temp
            = states('sensor.sbht_003c_414a_temperature') | float(25) %} {% set min_position
            = 18 %}  {% set max_position = 100 %} {% if temp <= min_temp %}\n  {{
            min_position }}\n{% elif temp >= max_temp %}\n  {{ max_position }}\n{%
            else %}\n  {{ ((temp - min_temp) / (max_temp - min_temp) * (max_position
            - min_position) + min_position) | int }}\n{% endif %}\n"
    - conditions:
      - condition: sun
        after: sunrise
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellyplus2pm_b8d61a89c634
