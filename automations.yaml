- id: '1785218644083'
  alias: Registrar duchas v2
  description: Registra consumo de hasta 4 duchas. Requiere luz del baño encendida.
  triggers:
  - entity_id: sensor.agua_caliente_pulse_counter_frequency_value
    above: 0
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: light.luz_bano
    state: 'on'
  - condition: state
    entity_id: input_boolean.ducha_en_curso
    state: 'off'
  actions:
  - target:
      entity_id: input_boolean.ducha_en_curso
    action: input_boolean.turn_on
  - target:
      entity_id: input_number.ducha_inicio
    data:
      value: '{{ states(''sensor.contador_agua_caliente_diario'') | float }}'
    action: input_number.set_value
  - parallel:
    - sequence:
      - wait_for_trigger:
        - entity_id: sensor.agua_caliente_pulse_counter_frequency_value
          below: 1
          for: 00:03:00
          trigger: numeric_state
        timeout: 00:45:00
        continue_on_timeout: true
      - target:
          entity_id: input_boolean.ducha_en_curso
        action: input_boolean.turn_off
    - sequence:
      - wait_for_trigger:
        - value_template: "{{ (states('sensor.contador_agua_caliente_diario') | float
            -\n    states('input_number.ducha_inicio') | float) >= 25 }}\n"
          trigger: template
        - entity_id: input_boolean.ducha_en_curso
          to: 'off'
          trigger: state
        timeout: 00:45:00
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger.platform == ''template'' }}'
          sequence:
          - data:
              scene_id: led_bano_pre_alerta
              snapshot_entities:
              - light.led_repisa_bano
            action: scene.create
          - repeat:
              count: 6
              sequence:
              - target:
                  entity_id: light.led_repisa_bano
                data:
                  rgbw_color:
                  - 255
                  - 60
                  - 0
                  - 0
                  brightness: 255
                  transition: 1
                action: light.turn_on
              - delay: '00:00:01.2'
              - target:
                  entity_id: light.led_repisa_bano
                data:
                  rgbw_color:
                  - 255
                  - 0
                  - 0
                  - 0
                  brightness: 30
                  transition: 1
                action: light.turn_on
              - delay: '00:00:01.2'
          - target:
              entity_id: scene.led_bano_pre_alerta
            action: scene.turn_on
  - target:
      entity_id: input_number.ducha_fin
    data:
      value: '{{ states(''sensor.contador_agua_caliente_diario'') | float }}'
    action: input_number.set_value
  - variables:
      consumo_calculado: '{% set inicio = states(''input_number.ducha_inicio'') |
        float %} {% set fin = states(''input_number.ducha_fin'') | float %} {% set
        consumo = fin - inicio %} {{ consumo | round(1) if consumo > 10 else 0 }}

        '
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: input_number.consumo_1o_ducha
        below: 1
      sequence:
      - target:
          entity_id: input_number.consumo_1o_ducha
        data:
          value: '{{ consumo_calculado }}'
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.consumo_2o_ducha
        below: 1
      sequence:
      - target:
          entity_id: input_number.consumo_2o_ducha
        data:
          value: '{{ consumo_calculado }}'
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.consumo_3o_ducha
        below: 1
      sequence:
      - target:
          entity_id: input_number.consumo_3o_ducha
        data:
          value: '{{ consumo_calculado }}'
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.consumo_4o_ducha
        below: 1
      sequence:
      - target:
          entity_id: input_number.consumo_4o_ducha
        data:
          value: '{{ consumo_calculado }}'
        action: input_number.set_value
  mode: single
