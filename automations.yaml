  alias: Alarma inundación termos
  description: Notifica y parpadea LED en rojo si se detecta inundación en los termos
    (08:00–23:00)
  triggers:
  - entity_id:
    - binary_sensor.humedad_termos_inundacion
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 08:00:00
    before: '23:00:00'
  actions:
  - action: scene.create
    data:
      scene_id: led_bano_pre_alarma_inundacion
      snapshot_entities:
      - light.led_repisa_bano
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.humedad_termos_inundacion
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.led_repisa_bano
        data:
          rgbw_color:
          - 255
          - 0
          - 0
          - 0
          brightness: 255
          transition: 0
      - delay: '00:00:00.500'
      - action: light.turn_off
        target:
          entity_id: light.led_repisa_bano
      - delay: '00:00:00.500'
  - action: scene.turn_on
    target:
      entity_id: scene.led_bano_pre_alarma_inundacion
  mode: single
